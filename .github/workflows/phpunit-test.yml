name: PHP Test

on: pull_request

permissions:
  contents: read

env:
  APP_NAME: integration_jmapc

concurrency:
  group: php-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      php-version: '["8.3","8.4","8.5"]'
      php-min: '8.3'
      php-max: '8.5'
      server-max: ${{ steps.versions.outputs.branches-max-list }}
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@cd0211ffcef1065e2020cd579e4843b8746e7a58 # v1.3.3

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src}}

    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/**'
              - 'appinfo/**'
              - 'lib/**'
              - 'templates/**'
              - 'tests/**'
              - 'vendor/**'
              - 'vendor-bin/**'
              - '.php-cs-fixer.dist.php'
              - 'composer.json'
              - 'composer.lock'

  php-unit:
    runs-on: ubuntu-latest

    needs: [changes, matrix]
    if: needs.changes.outputs.src != 'false'

    strategy:
      matrix:
        php-versions: ['${{ needs.matrix.outputs.php-min }}', '${{ needs.matrix.outputs.php-max }}']
        server-versions: ${{ fromJson(needs.matrix.outputs.server-max) }}

    name: Unit PHP ${{ matrix.php-versions }} Nextcloud ${{ matrix.server-versions }}

    steps:
      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: apps/${{ env.APP_NAME }}

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-versions }}
          # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development
          # Temporary workaround for missing pcntl_* in PHP 8.3
          ini-values: disable_functions=

      - name: Check composer file existence
        id: check_composer
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          files: apps/${{ env.APP_NAME }}/composer.json

      - name: Set up dependencies
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          composer remove nextcloud/ocp --dev --no-scripts
          composer i

      - name: Set up Nextcloud
        run: |
          mkdir data
          ./occ maintenance:install --verbose --database=sqlite --database-name=nextcloud --admin-user admin --admin-pass admin
          ./occ app:enable --force ${{ env.APP_NAME }}

      - name: Run tests
        working-directory: apps/${{ env.APP_NAME }}
        run: composer run test:unit

  php-databases:
    runs-on: ubuntu-latest

    needs: [changes, matrix]
    if: needs.changes.outputs.src != 'false'

    strategy:
      matrix:
        php-versions: ['${{ needs.matrix.outputs.php-min }}', '${{ needs.matrix.outputs.php-max }}']
        server-versions: ${{ fromJson(needs.matrix.outputs.server-max) }}
        database:
          - type: mariadb
            display: MariaDB 11.4
            version: '11.4'
            install-type: mysql
            host: 127.0.0.1
            port: '3306'
            name: nextcloud
            user: nextcloud
            pass: nextcloud
          - type: postgres
            display: PostgreSQL 16
            version: '16'
            install-type: pgsql
            host: 127.0.0.1
            port: '5432'
            name: nextcloud
            user: nextcloud
            pass: nextcloud
          - type: sqlite
            display: SQLite
            version: ''
            install-type: sqlite
            host: ''
            port: ''
            name: nextcloud
            user: ''
            pass: ''

    name: DB Integration ${{ matrix.database.display }} PHP ${{ matrix.php-versions }} Nextcloud ${{ matrix.server-versions }}

    services:
      mariadb-service:
        image: ${{ matrix.database.type == 'mariadb' && format('ghcr.io/nextcloud/continuous-integration-mariadb-{0}:latest', matrix.database.version) || 'ghcr.io/nextcloud/continuous-integration-mariadb-11.4:latest' }}
        env:
          MARIADB_ROOT_PASSWORD: rootpassword
          MARIADB_DATABASE: nextcloud
          MARIADB_USER: nextcloud
          MARIADB_PASSWORD: nextcloud
        ports:
          - 3306:3306/tcp
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5
      postgres-service:
        image: ${{ matrix.database.type == 'postgres' && format('ghcr.io/nextcloud/continuous-integration-postgres-{0}:latest', matrix.database.version) || 'ghcr.io/nextcloud/continuous-integration-postgres-16:latest' }}
        env:
          POSTGRES_USER: nextcloud
          POSTGRES_DB: nextcloud
          POSTGRES_PASSWORD: nextcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Enable ONLY_FULL_GROUP_BY MariaDB option
        if: matrix.database.type == 'mariadb'
        run: |
          echo "SET GLOBAL sql_mode=(SELECT CONCAT(@@sql_mode,',ONLY_FULL_GROUP_BY'));" | mysql -h 127.0.0.1 -u root -prootpassword
          echo 'SELECT @@sql_mode;' | mysql -h 127.0.0.1 -u root -prootpassword

      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: apps/${{ env.APP_NAME }}

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-versions }}
          # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, pgsql, pdo_pgsql
          coverage: none
          ini-file: development
          # Temporary workaround for missing pcntl_* in PHP 8.3
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check composer file existence
        id: check_composer
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          files: apps/${{ env.APP_NAME }}/composer.json

      - name: Set up dependencies
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          composer remove nextcloud/ocp --dev --no-scripts
          composer i
          
      - name: Set up Nextcloud
        env:
          DB_INSTALL_TYPE: ${{ matrix.database['install-type'] }}
          DB_HOST: ${{ matrix.database.host }}
          DB_PORT: ${{ matrix.database.port }}
          DB_NAME: ${{ matrix.database.name }}
          DB_USER: ${{ matrix.database.user }}
          DB_PASS: ${{ matrix.database.pass }}
        run: |
          mkdir data
          if [[ "$DB_INSTALL_TYPE" == 'sqlite' ]]; then
            ./occ maintenance:install --verbose \
              --database=sqlite \
              --database-name="$DB_NAME" \
              --admin-user admin \
              --admin-pass admin
          else
            ./occ maintenance:install --verbose \
              --database="$DB_INSTALL_TYPE" \
              --database-name="$DB_NAME" \
              --database-host="$DB_HOST" \
              --database-port="$DB_PORT" \
              --database-user="$DB_USER" \
              --database-pass="$DB_PASS" \
              --admin-user admin \
              --admin-pass admin
          fi
          ./occ app:enable --force ${{ env.APP_NAME }}

      - name: Run tests
        working-directory: apps/${{ env.APP_NAME }}
        run: composer run test:integration:db

  php-jmap:
    runs-on: ubuntu-latest

    needs: [changes, matrix]
    if: needs.changes.outputs.src != 'false'

    # must match tests/php/jmap/resources/services.json
    env:
      STALWART_ADMIN_PWD: adminpassword
      JMAP_HOST: stalwart.local
      JMAP_PORT: 8080
      JMAP_USERNAME: user1@stalwart.local
      JMAP_PASSWORD: Password1234

    services:
      mail-stalwart-service:
        image: stalwartlabs/stalwart:${{ matrix.stalwart-versions }}
        env:
          STALWART_ADMIN_PASSWORD: ${{ env.STALWART_ADMIN_PWD }}
        # stalwart builds the JMAP session urls from its hostname and listener port
        options: --hostname stalwart.local
        ports:
          - 8080:8080

    strategy:
      matrix:
        php-versions: ['${{ needs.matrix.outputs.php-max }}']
        server-versions: ${{ fromJson(needs.matrix.outputs.server-max) }}
        stalwart-versions: ['v0.15.5']

    name: JMAP Integration Stalwart ${{ matrix.stalwart-versions }} PHP ${{ matrix.php-versions }} Nextcloud ${{ matrix.server-versions }}

    steps:
      - name: Resolve JMAP host
        run: |
          echo "127.0.0.1 ${{ env.JMAP_HOST }}" | sudo tee -a /etc/hosts >/dev/null
          getent hosts ${{ env.JMAP_HOST }}

      - name: Wait for JMAP server admin API
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf -m 5 http://${{ env.JMAP_HOST }}:${{ env.JMAP_PORT }}/login >/dev/null 2>&1; then
              exit 0
            fi

            if [ "$attempt" -eq 30 ]; then
              echo 'Stalwart admin API did not become ready in time.' >&2
              exit 1
            fi

            sleep 2
          done

      - name: Create domain and account in JMAP server
        run: |
          curl -sf -X POST http://${{ env.JMAP_HOST }}:${{ env.JMAP_PORT }}/api/principal \
            -u "admin:${{ env.STALWART_ADMIN_PWD }}" \
            -H 'Content-Type: application/json' \
            -d '{"type":"domain","name":"${{ env.JMAP_HOST }}"}'
          curl -sf -X POST http://${{ env.JMAP_HOST }}:${{ env.JMAP_PORT }}/api/principal \
            -u "admin:${{ env.STALWART_ADMIN_PWD }}" \
            -H 'Content-Type: application/json' \
            -d '{"type":"individual","name":"${{ env.JMAP_USERNAME }}","secrets":["${{ env.JMAP_PASSWORD }}"],"emails":["${{ env.JMAP_USERNAME }}"],"roles":["user"]}'

      - name: Verify JMAP session
        run: |
          curl -sf -m 10 -u "${{ env.JMAP_USERNAME }}:${{ env.JMAP_PASSWORD }}" \
            -L http://${{ env.JMAP_HOST }}:${{ env.JMAP_PORT }}/.well-known/jmap

      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: apps/${{ env.APP_NAME }}

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-versions }}
          # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development
          # Temporary workaround for missing pcntl_* in PHP 8.3
          ini-values: disable_functions=

      - name: Check composer file existence
        id: check_composer
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          files: apps/${{ env.APP_NAME }}/composer.json

      - name: Set up dependencies
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          composer remove nextcloud/ocp --dev --no-scripts
          composer i

      - name: Set up Nextcloud
        run: |
          mkdir data
          ./occ maintenance:install --verbose --database=sqlite --database-name=nextcloud --admin-user admin --admin-pass admin
          ./occ config:system:set allow_local_remote_servers --value="true"
          ./occ app:enable --force ${{ env.APP_NAME }}

      - name: Run tests
        working-directory: apps/${{ env.APP_NAME }}
        env:
          STALWART_VERSION: ${{ matrix.stalwart-versions }}
        run: composer run test:integration:jmap

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [changes, php-unit, php-databases, php-jmap]

    if: always()

    name: php-test-summary

    steps:
      - name: PHP Test Summary status
        run: if ${{ needs.changes.outputs.src != 'false' && (needs.php-unit.result != 'success' || needs.php-databases.result != 'success' || needs.php-jmap.result != 'success') }}; then exit 1; fi